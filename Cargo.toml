[package]
name = "nebaz"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A fast, keyboard-driven, read-only terminal UI for browsing Azure"
repository = "https://github.com/neboto/nebaz"
homepage = "https://neboto.dev/azure"
readme = "README.md"
keywords = ["azure", "tui", "terminal", "ratatui", "cloud"]
categories = ["command-line-utilities"]

# `cargo binstall nebaz` pulls the prebuilt tarball the Release workflow
# attaches to each tag. The archive name must match what
# .github/workflows/release.yml produces and install.sh downloads.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
# TUI
ratatui = "0.30"
crossterm = "0.29"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Azure. No management-plane crate exists (ticket 01): every ARM call is a
# direct GET through the azure_core pipeline, and azure_identity supplies
# the Azure CLI credential (ADR 0003). `tokio` selects the async process
# executor for the `az` shell-out.
azure_core = "1"
azure_identity = { version = "1", features = ["tokio"] }

# Fuzzy search
fuzzy-matcher = "0.3"

# Error handling
thiserror = "2.0"

# Serialization + config
serde = { version = "1.0", features = ["derive"] }
# preserve_order keeps detail/export JSON keys in on-screen order instead of
# alphabetizing them (sections and fields read top-to-bottom like the pane).
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "1.1"

# Clipboard
arboard = "3.3"
base64 = "0.23"

# Temporary files ($EDITOR)
tempfile = "3.8"

# CLI
clap = { version = "4.6.1", features = ["derive"] }

# Dev builds: keep line tables for our own code, strip dependency debuginfo.
[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true

[profile.dev.package."*"]
debug = false
