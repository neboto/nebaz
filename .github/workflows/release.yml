# Release: build prebuilt binaries for every supported target and attach them
# to a GitHub Release. Ported from neboto-tui's release.yml; the private-repo
# knobs (RELEASE_ON_CI, BUILD_MACOS) are gone because nebaz is public and
# Actions minutes are free.
#
# Trigger by pushing a version tag that matches Cargo.toml:
#
#   cargo set-version 0.2.0      # or edit Cargo.toml by hand
#   git commit -am "Release v0.2.0"
#   git tag v0.2.0 && git push origin main v0.2.0
#
# The release is created as a DRAFT, every target uploads into it, and the
# final `publish` job flips it live only when all builds succeeded — so a
# half-built release is never visible.
#
# `workflow_dispatch` runs the whole build matrix as a DRY RUN (no release, no
# uploads; archives land as workflow artifacts) so a new target or toolchain
# can be checked without burning a tag.
#
# See docs/RELEASING.md for the runbook.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  create-release:
    name: create draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --draft --verify-tag --generate-notes $prerelease

  build:
    name: build ${{ matrix.target }}
    needs: [create-release]
    # Run after the draft exists, or standalone on a workflow_dispatch dry run
    # (where create-release is skipped).
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write       # upload assets to the draft release
      id-token: write       # OIDC identity for Sigstore keyless signing
      attestations: write   # store the provenance attestation on GitHub
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04          # oldest glibc GitHub still hosts → widest compatibility
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            build-tool: cross         # docker-based cross toolchain (needs a C compiler for aws-lc-sys, rustls' crypto)
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15              # cross-compiled from Apple Silicon; Intel runners are retired
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        if: matrix.build-tool == 'cross'
        with:
          tool: cross

      # Builds `nebaz` in release mode for the target, packs it (with the
      # listed files) into nebaz-<target>.tar.gz, writes nebaz-<target>.sha256
      # (sha256sum format, one line per asset), and uploads both to the draft
      # release. The names are what install.sh and cargo-binstall expect —
      # change all three together.
      - name: Build and upload
        id: build
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: nebaz
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool || 'cargo' }}
          locked: true
          tar: unix
          zip: none
          include: README.md,LICENSE,PERMISSIONS.md,config.example.toml
          checksum: sha256
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
          dry-run-intended: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Signed statement that this exact archive was built by this workflow,
      # from this commit, on a GitHub-hosted runner (Sigstore keyless signing,
      # recorded in the public transparency log, stored on GitHub). A swapped
      # archive fails verification even if its .sha256 was swapped with it —
      # both are uploaded by the same token, so the checksum alone can't tell.
      # Verify a download with:
      #   gh attestation verify nebaz-<target>.tar.gz --repo neboto/nebaz
      # Runs on dry runs too so a workflow_dispatch exercises the plumbing;
      # those attestations name artifacts that were never published, which is
      # harmless.
      - name: Attest build provenance
        if: steps.build.outcome == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.tar }}

      - name: Keep the archive + checksum as a workflow artifact (dry run only)
        if: github.event_name == 'workflow_dispatch' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nebaz-${{ matrix.target }}
          path: |
            nebaz-${{ matrix.target }}.tar.gz
            nebaz-${{ matrix.target }}.sha256
          if-no-files-found: error

  publish:
    name: publish release
    needs: [create-release, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Flip the draft live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
